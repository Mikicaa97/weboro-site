# Dual-host prep: Netlify Free alongside existing Vercel deployment.
# Production canonical remains https://weboro.io (not tied to host).

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Vite 7 requires Node 20.19+ / 22.12+
  NODE_VERSION = "22"

# Security headers (parity with vercel.json — no aggressive CSP)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# --- Permanent SEO redirects (MUST be before SPA fallback) ---

[[redirects]]
  from = "/usluge/google-marketing"
  to = "/usluge/growth"
  status = 301
  force = true

[[redirects]]
  from = "/portfolio/bleki"
  to = "/portfolio"
  status = 301
  force = true

[[redirects]]
  from = "/portfolio/prodaj-automobil"
  to = "/portfolio"
  status = 301
  force = true

[[redirects]]
  from = "/outreachgenie"
  to = "/portfolio/outreachgenie"
  status = 301
  force = true

[[redirects]]
  from = "/outreachgenie/*"
  to = "/portfolio/outreachgenie"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/blog"
  status = 301
  force = true

# --- API rewrite (before SPA fallback so /api/contact is not swallowed) ---

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# --- Vue Router history mode SPA fallback ---

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
